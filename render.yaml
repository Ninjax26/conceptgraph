services:
  - type: web
    name: conceptgraph-api
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conceptgraph-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: conceptgraph-redis
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: conceptgraph_chunks
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ACCESS_TOKEN
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUTH_SESSION_TTL_SECONDS
        value: "43200"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_EXPENSIVE_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_LOGIN_PER_MINUTE
        value: "10"

  - type: worker
    name: conceptgraph-worker
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: celery -A app.tasks.document_tasks.celery_app worker --loglevel=info --pool=solo --concurrency=1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conceptgraph-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: conceptgraph-redis
          property: connectionString
      - key: LLM_PROVIDER
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: LLM_PROVIDER
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: GROQ_API_KEY
      - key: GROQ_MODEL
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: GROQ_MODEL
      - key: NEO4J_URI
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: NEO4J_URI
      - key: NEO4J_USERNAME
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: NEO4J_USERNAME
      - key: NEO4J_PASSWORD
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: NEO4J_PASSWORD
      - key: QDRANT_URL
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: QDRANT_URL
      - key: QDRANT_API_KEY
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: QDRANT_API_KEY
      - key: QDRANT_COLLECTION_NAME
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: QDRANT_COLLECTION_NAME
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_BUCKET
      - key: S3_REGION
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_REGION
      - key: S3_ENDPOINT_URL
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_ENDPOINT_URL
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_FORCE_PATH_STYLE
        fromService:
          type: web
          name: conceptgraph-api
          envVarKey: S3_FORCE_PATH_STYLE
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"

  - type: web
    name: conceptgraph-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: conceptgraph-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: conceptgraph-postgres
    databaseName: conceptgraph
    user: conceptgraph
    plan: basic-256mb
    ipAllowList: []
